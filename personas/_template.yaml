# ---------------------------------------------------------------------------
# Anything below here is OPTIONAL and open-ended.
#
# Every field above is one Byline reads by name. Everything below is carried
# into the writing brief as your own standing direction — and so is any field
# you invent that is not listed here at all. Add `newsletter_style`,
# `things_i_never_say`, whatever you actually need; unknown fields are kept,
# not discarded.
#
# A few are wired to specific machinery rather than printed as free text:
#   preferred_article_length  sets the default word count (first number wins)
#   avoid_in_writing          is added to the brief's banned list
#   target_audience           pitches every explanation at the least
#                             specialist reader you name
#   citation_preference, fact_checking_level, preferred_quotes_from,
#   quote_usage_frequency     shape the evidence and sourcing rules
#   favorite_rhetorical_devices, commonly_used_transitions, use_of_humor
#                             join the per-article voice texture
#
# Do NOT pin the article's opening, ending or overall shape here. Byline draws
# a fresh hook, arc and closing for every article on purpose, so a weekly blog
# does not publish the same skeleton every week. Fixing them in the persona
# undoes that.
#
# Leave any of these out entirely if you have nothing to say — an empty value
# is dropped rather than sent to the writer as a blank instruction.
# ---------------------------------------------------------------------------

